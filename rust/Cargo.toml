[package]
name = "rust_lib_vnt_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]

serde = { version = "1.0", features = ["derive"] }
flutter_rust_bridge = "2.1.0"
# 固定到当前主分支 commit，避免上游后续破坏性变更再次导致编译失败
vnt = { git = "https://github.com/lmq8267/vnt-Redir.git", rev = "cce3e3a7de0bd9b3c832fabff847637e0f9c0483", features = ["ring-cipher", "wss"] }
anyhow = "1.0.82"
tokio = { version = "1.37.0", features = ["full"] }

log = "0.4.17"
log4rs = "1.2.0"



[target.'cfg(windows)'.build-dependencies]
thunk-rs = { version = "0.3.3", features = ["win7"] }

