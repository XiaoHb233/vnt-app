name: VntApp

on:
  push:
    branches:
      - flutter
  workflow_dispatch:
    inputs:
      rebuild_android_so:
        description: '是否重新打包安卓so库？'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 1
  # 使用国内镜像加速 Rust 下载
  RUSTUP_DIST_SERVER: https://rsproxy.cn
  RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
permissions:
  contents: write

jobs:
  build:
    name: vntApp-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
         ref: flutter

      - name: 配置国内镜像源
        run: |
          # 配置 Flutter 国内镜像
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV
          # 配置 Gradle 国内镜像
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: 设置JDK环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: 3.22.0
          cache: true

      - name: 设置 Rust 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/bin
          key: ${{ runner.os }}-rust-toolchain-1.88.0

      - name: 固定 Rust 版本 1.88
        shell: bash
        run: |
          if ! command -v rustc &> /dev/null || [ "$(rustc --version | cut -d' ' -f2)" != "1.88.0" ]; then
            echo "🔧 安装 Rust 1.88.0..."
            rustup set auto-self-update disable
            rustup toolchain install 1.88.0 --profile minimal
            rustup default 1.88.0
            rustup component add rust-src --toolchain 1.88.0
          else
            echo "✅ Rust 1.88.0 已安装"
          fi
          rustc -V
          cargo -V

      - name: 缓存 Rust 依赖和编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 缓存 Flutter / Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
          key: ${{ runner.os }}-android-sdk-30-33
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: 安装 Android Rust 目标
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android 2>/dev/null || true
          sed -i 's|main|Android|' rust/Cargo.toml

      - name: 快速构建 Android vntAPP
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-x64

      - name: 签名 APK
        run: |
          password=vntAPP
          keytool -genkeypair \
            -v \
            -keystore keystore.jks \
            -storepass "$password" \
            -alias key \
            -keypass "$password" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android, OU=Android, O=Android, L=BeiJing, ST=BeiJing, C=CN" 2>/dev/null

          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -1)
          /usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias key \
            --ks-pass pass:$password \
            --key-pass pass:$password \
            --out vntApp-android.apk \
            --in build/app/outputs/apk/release/app-release.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vntApp-android
          path: vntApp-android.apk
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: 列出文件
        run: find ./artifacts -type f -name "*.apk" -exec ls -lh {} \;
