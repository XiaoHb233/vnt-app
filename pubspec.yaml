name: vnt_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.17

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.6
  device_info_plus: ^10.0.0
  shared_preferences: ^2.0.0
  rust_lib_vnt_app:
    path: rust_builder
  flutter_rust_bridge: 2.1.0
  path_provider: ^2.1.3
  yaml: ^3.1.0
  json2yaml: ^3.0.1
  url_launcher: ^6.2.6
  synchronized: ^3.0.0
  fl_chart: ^0.68.0
  uuid: ^3.0.7
  file_picker: ^8.0.0
  share_plus: ^7.2.2
  flex_color_picker: ^3.3.0
  # 使用 flutter_inappwebview 替代 webview_flutter，性能更好
  # 使用 5.8.0 版本兼容 Flutter 3.22.0
  flutter_inappwebview: ^5.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/ic_launcher.png
    - assets/log4rs.yaml
